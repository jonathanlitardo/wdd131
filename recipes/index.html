<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover delicious recipes for every occasion. Browse our collection of easy-to-follow recipes with ratings and step-by-step instructions.">
    <meta name="author" content="Jonathan Litardo">
    
    <!-- Open Graph Meta Tags for Social Media -->
    <meta property="og:title" content="Recipe Book - Delicious Recipes">
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Discover delicious recipes for every occasion. Browse our collection of easy-to-follow recipes with ratings and step-by-step instructions.">
    <meta property="og:image" content="images/apple-crisp.jpg">
    <meta property="og:url" content="https://jonathanlitardo.github.io/wdd131/recipes">
    <meta name="twitter:card" content="summary_large_image">
    
    <title>Recipe Book - Delicious Recipes</title>
    <link rel="icon" type="image/png" href="images/recipe-book.png">
    <link rel="stylesheet" href="recipes.css">
    <script src="main.js" type="module" defer></script>
</head>
<body>
    <header>
        <div class="header-content">
            <img src="images/recipe-book.png" alt="Recipe Book Icon" class="logo">
            <h1>RecipeBook</h1>
        </div>
    </header>

    <main>
        <section class="search-section">
            <form class="search-form" role="search">
                <label for="search-input" class="visually-hidden">Find a Recipe</label>
                <input 
                    type="text" 
                    id="search-input" 
                    name="search" 
                    placeholder="Find a recipe"
                    aria-label="Search for recipes"
                >
                <button type="submit" aria-label="Search">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M21 21L16.65 16.65M19 11C19 15.4183 15.4183 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 19 11Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
        </section>
        <hr class="section-divider">


        <section class="recipes" id="recipe-list">
            <!-- Recipes will be dynamically inserted here -->
        </section>
    </main>

    <footer>
        <div class="social">

            <a href="#" aria-label="Visit our Instagram page">
                <img src="images/instagram_icon.svg" alt="Instagram icon">
            </a>
            <a href="#" aria-label="Visit our YouTube channel">
                <img src="images/youtube_icon.svg" alt="YouTube icon">
            </a>
            <a href="#" aria-label="Visit our Pinterest page">
                <img src="images/pinterest_icon.svg" alt="Pinterest icon">
            </a>
        </div>
        <p class="attribution">
            <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
        </p>
    </footer>
</body>
</html>
